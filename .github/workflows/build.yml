name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    env:
      # 跳过 macOS 代码签名（如需签名配置 CSC_FOR_PULL_REQUEST 等证书 secrets）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node.js >= 22.13（依赖 node:sqlite 内置模块）
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (${{ matrix.script }})
        run: pnpm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onedb-${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.msi
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.blockmap
            release/*/*.yml
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 去掉每平台的顶层目录，方便统一收集安装包
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
